<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Aether 3D Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #9fd4ff; font-family: system-ui, sans-serif; font-size: 18px; letter-spacing: 2px;
            text-shadow: 0 0 18px rgba(0, 200, 255, 0.8), 0 0 60px rgba(0, 120, 255, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading">Loading Aether Engine...</div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('loading');
        var Module = {
            preRun: [],
            postRun: [function() {
                statusElement.style.display = 'none';
            }],
            canvas: (function() {
                return document.getElementById('canvas');
            })(),
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
                if (text && typeof text === 'string' && !text.startsWith('[') && text.indexOf('warning') === -1) {
                    statusElement.innerHTML = 'Error: ' + text;
                    statusElement.style.color = '#f44';
                }
            },
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                if (text) {
                    statusElement.innerHTML = text;
                } else {
                    statusElement.style.display = 'none';
                }
            },
            monitorRunDependencies: function(left) {},
            webgpu: {
                enabled: true
            }
        };
        window.onerror = function(event) {
            console.error("On error:", event);
            statusElement.innerHTML = 'Error: ' + event;
            statusElement.style.color = '#f44';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
